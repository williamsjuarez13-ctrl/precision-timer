<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrecisionTimer · Measured Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030711;--card:#0a1220;--card-h:#121f38;--border:#172240;--border-h:#1e3058;
  --txt:#e2e8f0;--txt2:#94a3b8;--txt3:#64748b;
  --band80:#184f95;--band50:#3987e5;--pos:#3987e5;--neg:#e66767;--line:#3987e5;
  --good:#0ca30c;--warning:#fab219;--serious:#ec835a;--critical:#d03b3b;
  --mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Outfit',system-ui,sans-serif;--r:14px;
}
*{box-sizing:border-box;margin:0}
html{font-size:15px}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.45}
a{color:var(--band50);text-decoration:none}a:hover{text-decoration:underline}
.W{max-width:1180px;margin:0 auto;padding:12px 16px 64px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:6px 0 14px}
.logo{font-weight:700;font-size:20px;letter-spacing:-.01em}.logo span{color:var(--band50)}.logo small{font-family:var(--mono);font-size:11px;color:var(--txt3);font-weight:500;margin-left:6px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--txt2);background:var(--card);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--txt3);flex:none}
.st-good .dot{background:var(--good)}.st-warning .dot{background:var(--warning)}.st-critical .dot{background:var(--critical)}.st-serious .dot{background:var(--serious)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);margin-bottom:12px}
h3{font-size:15px;font-weight:600;margin-bottom:6px}
.note{font-size:12.5px;color:var(--txt2)}.muted{color:var(--txt3)}.mono{font-family:var(--mono)}
.alert{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;border:1px solid var(--border);display:flex;gap:8px;align-items:flex-start}
.alert b{font-weight:600}.alert.critical{border-color:var(--critical)}.alert.warning{border-color:var(--warning)}
.grid{display:grid;gap:14px}@media(min-width:860px){.g2{grid-template-columns:1.1fr .9fr}.g3{grid-template-columns:repeat(3,1fr)}}
.hero{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.hero .big{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1}.hero .lbl{font-size:15px;color:var(--txt2)}
.facts{display:grid;gap:6px;margin:10px 0 4px}.fact{display:flex;gap:8px;align-items:center;font-size:13.5px}
.ic{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;color:#04070f}
.ic.y{background:var(--good)}.ic.n{background:var(--critical);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;color:var(--txt3);text-align:right;padding:6px 8px;font-size:11.5px;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:7px 8px;text-align:right;border-bottom:1px solid rgba(23,34,64,.6);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}.tl{text-align:left}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--card-h)}tr.sel{background:var(--card-h)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;border:1px solid var(--border-h);color:var(--txt2);margin-left:4px}
.q{display:inline-flex;gap:2px;vertical-align:middle}.q i{width:5px;height:12px;border-radius:2px;background:var(--border-h)}.q i.on{background:var(--band50)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
button,select,input{font-family:var(--sans);font-size:13px;color:var(--txt);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
button{cursor:pointer;color:var(--txt2)}button:hover{border-color:var(--border-h);color:var(--txt)}button.on{border-color:var(--band50);color:var(--txt)}
input[type=number]{width:110px;font-family:var(--mono)}label{font-size:12px;color:var(--txt3);display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:8px}
.tile{border:1px solid var(--border);border-radius:10px;padding:10px 12px}.tile .v{font-size:22px;font-weight:600;letter-spacing:-.01em}.tile .l{font-size:12px;color:var(--txt3)}.tile .s{font-size:11.5px;color:var(--txt2);margin-top:2px}
.meter{position:relative;height:6px;border-radius:4px;background:var(--border);margin-top:8px}.meter b{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--band50)}.meter u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--txt)}
svg{display:block;width:100%;overflow:visible}svg text{font-family:var(--mono);font-size:10.5px;fill:var(--txt2)}
.coin{border:1px solid var(--border);border-radius:12px;padding:12px}.coin .p{font-size:22px;font-weight:600}.coin .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rb-l{font-size:11.5px;color:var(--txt3);margin:8px 0 2px;display:flex;justify-content:space-between}
.tip{position:fixed;z-index:9;pointer-events:none;background:#0d1830;border:1px solid var(--border-h);border-radius:8px;padding:8px 10px;font-size:12px;max-width:260px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.tip b{font-weight:600;display:block;margin-bottom:2px}.tip div{display:flex;justify-content:space-between;gap:14px}.tip div span:last-child{font-family:var(--mono)}
pre{white-space:pre-wrap;font-family:var(--mono);font-size:11.5px;color:var(--txt2);border-top:1px solid var(--border);padding-top:8px;margin-top:8px}
details summary{cursor:pointer;color:var(--txt2);font-size:13px}
footer{color:var(--txt3);font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="W">
  <header>
    <div class="logo">Precision<span>Timer</span><small>v11 · measured</small></div>
    <span class="sp"></span>
    <span class="chip" id="age"><span class="dot"></span><span>loading…</span></span>
    <a class="chip" href="classic.html">Classic dashboard</a>
  </header>
  <div id="banners"></div>
  <div class="grid g2">
    <section class="card" id="market"><h2>Market</h2><p class="note">Loading…</p></section>
    <section class="card" id="mine"><h2>Your coins</h2><p class="note">Loading…</p></section>
  </div>
  <section class="card" id="detail"><h2>Coin detail</h2></section>
  <section class="card" id="board"><h2>Board</h2></section>
  <div class="grid g2">
    <section class="card" id="events"><h2>Events</h2></section>
    <section class="card" id="score"><h2>Scorecard</h2></section>
  </div>
  <footer id="foot"></footer>
</div>
<div class="tip" id="tip" hidden></div>

<script type="module">
// The page does no market maths of its own: probabilities come from engine/forecast.js (the same
// file the backtest and the scan run) reading model/model.js (measurements), under pt.config.js (policy).
import config from './pt.config.js';
import model from './model/model.js';
import { bands, touchProb, planOdds, isExtrapolated, HORIZONS } from './engine/forecast.js';

const $ = id => document.getElementById(id);
const h = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (v === null || v === undefined || v === false) continue; if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'html') e.innerHTML = v; else e.setAttribute(k, v); } for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c))); return e; };
const NS = 'http://www.w3.org/2000/svg';
const s = (tag, attrs = {}, ...kids) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) e.setAttribute(k, v); for (const c of kids.flat()) if (c) e.append(c.nodeType ? c : document.createTextNode(String(c))); return e; };
const fp = p => { if (p === null || p === undefined || Number.isNaN(p)) return '—'; const a = Math.abs(p); return a >= 1000 ? p.toLocaleString('en-US', { maximumFractionDigits: 0 }) : a >= 100 ? p.toFixed(1) : a >= 1 ? p.toFixed(2) : a >= 0.01 ? p.toFixed(4) : p.toPrecision(3); };
const pc = (x, d = 0) => (x === null || x === undefined ? '—' : (x * 100).toFixed(d) + '%');
const sg = (x, d = 1) => (x === null || x === undefined ? '—' : (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(d) + '%');
const ago = t => { const m = Math.max(0, (Date.now() - Date.parse(t)) / 60e3); return m < 90 ? Math.round(m) + ' min ago' : m < 2880 ? (m / 60).toFixed(1) + ' h ago' : (m / 1440).toFixed(1) + ' days ago'; };
const tip = $('tip');
function showTip(ev, title, rows) { tip.replaceChildren(h('b', {}, title), ...rows.map(([a, b]) => h('div', {}, h('span', {}, a), h('span', {}, b)))); tip.hidden = false; const x = Math.min(window.innerWidth - tip.offsetWidth - 8, ev.clientX + 14), y = Math.min(window.innerHeight - tip.offsetHeight - 8, ev.clientY + 14); tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px'; }
const hideTip = () => { tip.hidden = true; };
const hover = (el, title, rows) => { el.addEventListener('pointermove', e => showTip(e, typeof title === 'function' ? title() : title, typeof rows === 'function' ? rows() : rows)); el.addEventListener('pointerleave', hideTip); return el; };

let board = null, card = null, alerts = null, scanState = null, source = '', selected = null, filter = 'all';
const all = () => [...board.rows, ...(board.extra || [])];
const rowOf = sym => all().find(r => r.sym === sym);

/* ───────── data ───────── */
async function getJson(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(url.split('?')[0].split('/').pop() + ' → HTTP ' + r.status); return r.json(); }
async function load() {
  const local = new URLSearchParams(location.search).get('data');          // ?data=data → read a local scan output folder
  const base = local ? local.replace(/\/$/, '') : `https://raw.githubusercontent.com/${config.repo}/${config.dataBranch}`;
  const bust = '?t=' + Math.floor(Date.now() / 300e3);
  let scan = null, live = null, errs = [];
  try { scan = await getJson(`${base}/board.json${bust}`); } catch (e) { errs.push(e.message); }
  const stale = !scan || Date.now() - Date.parse(scan.generatedAt) > 3 * 3600e3;
  if (stale && !local) { try { live = await getJson('/api/board'); } catch (e) { errs.push(e.message); } }
  board = live && (!scan || Date.parse(live.generatedAt) > Date.parse(scan.generatedAt)) ? live : scan;
  source = board === live ? 'computed on demand' : 'hourly scan';
  try { card = await getJson(`${base}/scorecard.json${bust}`); } catch { card = null; }
  try { alerts = await getJson(`${base}/alerts.json${bust}`); } catch { alerts = null; }
  try { scanState = await getJson(`${base}/state.json${bust}`); } catch { scanState = null; }
  if (!board) { $('banners').replaceChildren(h('div', { class: 'alert critical' }, h('span', {}, '✕'), h('span', {}, h('b', {}, 'No data. '), `Neither the scan output nor the on-demand endpoint answered (${errs.join('; ')}). Check GitHub → Actions → "PrecisionTimer scan", and that /api/board is deployed.`))); $('age').lastChild.textContent = 'no data'; $('age').className = 'chip st-critical'; return; }
  selected = selected || (board.holdings[0] && rowOf(board.holdings[0]) ? board.holdings[0] : 'ETH');
  render(scan && live && board === live);
}

/* ───────── header + banners ───────── */
function renderHead(scanStale) {
  const ageMin = (Date.now() - Date.parse(board.generatedAt)) / 60e3, closeAgeH = (Date.now() - Date.parse(board.asOfCloseTime)) / 3600e3;
  const st = closeAgeH > 36 ? 'critical' : ageMin > 180 ? 'warning' : 'good';
  $('age').className = 'chip st-' + st; $('age').lastChild.textContent = `${st === 'good' ? 'Current' : st === 'warning' ? 'Aging' : 'STALE'} · close of ${board.asOf} · prices ${ago(board.generatedAt)} · ${source}`;
  const B = [];
  if (st === 'critical') B.push(h('div', { class: 'alert critical' }, h('span', {}, '✕'), h('span', {}, h('b', {}, 'Stale. '), `The newest daily close on this page is ${board.asOf}. Nothing below reflects the market since then.`)));
  if (scanStale || (!card && source !== 'hourly scan')) B.push(h('div', { class: 'alert warning' }, h('span', {}, '!'), h('span', {}, h('b', {}, 'The hourly scan is not running. '), 'This board was computed on demand, so it is current — but nothing is being logged, scored or alerted. Fix: GitHub → Actions → "PrecisionTimer scan" (README, step 2).')));
  if (scanState && scanState.lastError) B.push(h('div', { class: 'alert critical' }, h('span', {}, '✕'), h('span', {}, h('b', {}, 'The last scan failed. '), `${scanState.lastError.at.slice(0, 16).replace('T', ' ')} UTC — ${scanState.lastError.message}. Nothing is being logged or alerted until it is fixed (GitHub → Actions → "PrecisionTimer scan").`)));
  if (board.configDrift) B.push(h('div', { class: 'alert warning' }, h('span', {}, '!'), h('span', {}, h('b', {}, 'Settings changed since the model was measured. '), 'The statistics shown describe the previous rules. Run the "PrecisionTimer calibrate" workflow.')));
  if ((Date.now() - Date.parse(model.fittedThrough)) / 864e5 > 60) B.push(h('div', { class: 'alert warning' }, h('span', {}, '!'), h('span', {}, h('b', {}, 'Model is ' + Math.round((Date.now() - Date.parse(model.fittedThrough)) / 864e5) + ' days old. '), 'Re-measure with the "PrecisionTimer calibrate" workflow.')));
  if (board.noData && board.noData.length) B.push(h('div', { class: 'alert warning' }, h('span', {}, '!'), h('span', {}, h('b', {}, 'No candles for: '), board.noData.join(', ') + ' — check the tickers in pt.config.js.')));
  $('banners').replaceChildren(...B);
}

/* ───────── market ───────── */
function breadthChart(hist) {
  const W = 520, H = 96, L = 4, R = 44, T = 8, B = 16, n = hist.length, x = i => L + (W - L - R) * i / Math.max(1, n - 1), y = v => T + (H - T - B) * (1 - v);
  const pts = hist.map((d, i) => `${x(i).toFixed(1)},${y(d.breadth50 ?? 0).toFixed(1)}`).join(' ');
  const cur = s('g', { style: 'display:none' }, s('line', { y1: T, y2: H - B, stroke: 'var(--txt3)', 'stroke-width': 1 }), s('circle', { r: 4, fill: 'var(--line)', stroke: 'var(--card)', 'stroke-width': 2 }));
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Share of the universe above its 50-day average, last ' + n + ' days' },
    s('line', { x1: L, x2: W - R, y1: y(0.5), y2: y(0.5), stroke: 'var(--border-h)', 'stroke-width': 1, 'stroke-dasharray': '3 3' }),
    s('text', { x: W - R + 6, y: y(0.5) + 3.5 }, '50%'),
    s('polyline', { points: pts, fill: 'none', stroke: 'var(--line)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }),
    s('circle', { cx: x(n - 1), cy: y(hist[n - 1].breadth50 ?? 0), r: 4, fill: 'var(--line)', stroke: 'var(--card)', 'stroke-width': 2 }),
    s('text', { x: L, y: H - 3 }, hist[0].day.slice(5)), s('text', { x: W - R, y: H - 3, 'text-anchor': 'end' }, hist[n - 1].day.slice(5)), cur);
  svg.addEventListener('pointermove', e => { const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.round(((e.clientX - r.left) / r.width * W - L) / (W - L - R) * (n - 1)))), d = hist[i];
    cur.style.display = ''; cur.firstChild.setAttribute('x1', x(i)); cur.firstChild.setAttribute('x2', x(i)); cur.lastChild.setAttribute('cx', x(i)); cur.lastChild.setAttribute('cy', y(d.breadth50 ?? 0));
    showTip(e, d.day, [['Above 50-day average', pc(d.breadth50)], ['Trend', d.trend + '/3'], ['Exposure gate', d.gate]]); });
  svg.addEventListener('pointerleave', () => { cur.style.display = 'none'; hideTip(); });
  return svg;
}
function renderMarket() {
  const m = board.market, c = m.components, st = model.market.byTrend[m.trend], g = model.market.gateCurves;
  const fact = (ok, text) => h('div', { class: 'fact' }, h('span', { class: 'ic ' + (ok ? 'y' : 'n'), 'aria-hidden': 'true' }, ok ? '✓' : '✕'), h('span', {}, h('span', { class: 'muted' }, ok ? 'Yes — ' : 'No — '), text));
  const cell = d => (d ? [sg(d.median), pc(d.pUp), pc(d.pDown10)] : ['—', '—', '—']);
  const rows = [['BTC', st.BTC[30]], ['ETH', st.ETH[30]], ['Average coin on the board', st.universe[30]]].map(([n, d]) => h('tr', {}, h('td', {}, n), ...cell(d).map(v => h('td', {}, v))));
  $('market').replaceChildren(h('h2', {}, 'Market'),
    h('div', { class: 'hero' }, h('span', { class: 'big' }, m.trend + '/3'), h('span', { class: 'lbl' }, 'trend facts true · exposure gate '), h('span', { class: 'chip st-' + (m.gate === 'ON' ? 'good' : 'critical') }, h('span', { class: 'dot' }), `${m.gate} for ${m.gateDays} day${m.gateDays === 1 ? '' : 's'}`),
      m.washout && h('span', { class: 'chip st-warning' }, h('span', { class: 'dot' }), 'washout: median RSI ' + m.medianRsi)),
    h('div', { class: 'facts' },
      fact(c.btcAbove200, `BTC closed ${sg(m.btcVs200)} vs its 200-day average`),
      fact(c.btc30dUp, `BTC is ${sg(m.btc30d)} over 30 days`),
      fact(c.breadthOk, `${pc(m.breadth50)} of the ${m.members} coins are above their 50-day average (needs ${pc(config.regime.breadthThreshold)})`)),
    breadthChart(m.history),
    h('h3', { style: 'margin-top:12px' }, `What followed the ${st.days} days like this since ${model.fittedFrom.slice(0, 4)} — next 30 days`),
    h('div', { class: 'scroll' }, h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, ''), h('th', {}, 'Median'), h('th', {}, 'Ended higher'), h('th', {}, 'Fell 10%+'))), h('tbody', {}, rows))),
    h('p', { class: 'note', style: 'margin-top:10px' }, `The gate is an exposure rule, not a forecast. From ${model.split} on, holding ETH only while it was ON returned ${sg(g.ETH.test.gated.totalPct, 0)} against ${sg(g.ETH.test.hold.totalPct, 0)} for buy-and-hold, with a worst drawdown of ${sg(g.ETH.test.gated.maxDrawdownPct, 0)} against ${sg(g.ETH.test.hold.maxDrawdownPct, 0)}; BTC ${sg(g.BTC.test.gated.totalPct, 0)} against ${sg(g.BTC.test.hold.totalPct, 0)}, drawdown ${sg(g.BTC.test.gated.maxDrawdownPct, 0)} against ${sg(g.BTC.test.hold.maxDrawdownPct, 0)}. It flips about ${g.ETH.test.gated.switchesPerYear} times a year and is late at both ends by design.`));
}

/* ───────── range bar ───────── */
function rangeBar(r, k) {
  const b = r.bands[k]; if (!b) return h('p', { class: 'note' }, 'no range (needs 90 days of history)');
  const W = 520, H = 40, lo = Math.log(Math.min(b.p05, r.price) * 0.985), hi = Math.log(Math.max(b.p95, r.price) * 1.015), x = v => 6 + (W - 12) * (Math.log(v) - lo) / (hi - lo), Y = 8, Hb = 12;
  // outer 80% segments: 4px rounded on the outside end only, square where they meet the 50% band (2px surface gap)
  const segL = (a, c) => s('path', { d: `M${x(a) + 4},${Y} H${x(c)} V${Y + Hb} H${x(a) + 4} Q${x(a)},${Y + Hb} ${x(a)},${Y + Hb - 4} V${Y + 4} Q${x(a)},${Y} ${x(a) + 4},${Y} Z`, fill: 'var(--band80)' });
  const segR = (a, c) => s('path', { d: `M${x(a)},${Y} H${x(c) - 4} Q${x(c)},${Y} ${x(c)},${Y + 4} V${Y + Hb - 4} Q${x(c)},${Y + Hb} ${x(c) - 4},${Y + Hb} H${x(a)} Z`, fill: 'var(--band80)' });
  const g = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `${r.sym} ${k}-day range: 80% between ${fp(b.p10)} and ${fp(b.p90)}` },
    segL(b.p10, b.p25), s('rect', { x: x(b.p25) + 2, y: Y, width: Math.max(0, x(b.p75) - x(b.p25) - 4), height: Hb, fill: 'var(--band50)' }), segR(b.p75, b.p90),
    s('line', { x1: x(b.p50), x2: x(b.p50), y1: Y - 3, y2: Y + Hb + 3, stroke: 'var(--txt)', 'stroke-width': 2 }),
    s('circle', { cx: x(r.price), cy: Y + Hb / 2, r: 5, fill: 'var(--txt)', stroke: 'var(--card)', 'stroke-width': 2 }),
    s('text', { x: x(b.p10), y: H - 4, 'text-anchor': 'start' }, fp(b.p10)), s('text', { x: x(b.p90), y: H - 4, 'text-anchor': 'end' }, fp(b.p90)));
  return hover(g, `${r.sym} — close ${k} days from now`, [['95% of the time below', fp(b.p95)], ['90%', fp(b.p90)], ['75%', fp(b.p75)], ['Median', fp(b.p50)], ['25%', fp(b.p25)], ['10%', fp(b.p10)], ['5% of the time below', fp(b.p05)], ['Now', fp(r.price)]]);
}
const quint = q => h('span', { class: 'q', title: q ? `fifth ${q} of 5 (5 = best)` : 'not ranked' }, ...[1, 2, 3, 4, 5].map(i => h('i', { class: q && i <= q ? 'on' : '' })));

/* ───────── events ───────── */
function renderEvents() {

  if (!board.events.length) kids.push(h('p', { class: 'note' }, 'None today.'));
  const groups = {}; for (const e of board.events) (groups[e.event + '|' + e.tier] = groups[e.event + '|' + e.tier] || []).push(e);
  for (const [k, list] of Object.entries(groups)) { const [id, tier] = k.split('|'), E = model.events.byEvent[id], a = E.tiers[tier].all, t = E.tiers[tier].test;

/* ───────── scorecard ───────── */
function quintileChart() {

    s('line', { x1: L, x2: W - R, y1: y0, y2: y0, stroke: 'var(--border-h)', 'stroke-width': 1 }),
    ...Q.map((v, i) => { const x = L + bw * i + bw / 2 - 12, hh = Math.max(6, Math.abs(v) * sc), up = v >= 0;

function renderScore() {

    const ev = Object.entries(card.events); if (ev.length) kids.push(h('div', { class: 'scroll', style: 'margin-top:10px' }, h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Event plans closed'), h('th', {}, 'n'), h('th', {}, 'Avg R'), h('th', {}, 'Winners'), h('th', {}, 'Backtest R'))), h('tbody', {}, ev.map(([k, e]) => { const [id, tier] = k.split('|'); return h('tr', {}, h('td', {}, `${id.toLowerCase()} · ${tier}`), h('td', {}, e.n), h('td', { class: 'mono' }, (e.meanR >= 0 ? '+' : '') + e.meanR.toFixed(2)), h('td', {}, pc(e.win)), h('td', { class: 'mono' }, (m => (m === undefined ? '—' : (m >= 0 ? '+' : '') + m.toFixed(2)))(model.events.byEvent[id]?.tiers[tier]?.all.plan?.meanR))); })))));
  } else kids.push(h('p', { class: 'note' }, 'No live record yet. Once the hourly scan runs (README, step 2) every range, rank and event plan is frozen at the daily close and scored here when it matures — 7 days for the first numbers.'));

  $('score').replaceChildren(...kids);
}

function render(scanStale) {
  renderHead(scanStale); renderMarket(); renderMine(); renderDetail(); renderBoard(); renderEvents(); renderScore();
